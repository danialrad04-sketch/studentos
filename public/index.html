      const circumference = radius * 2 * Math.PI;
      const offset = circumference - (percentage / 100) * circumference;

      return (
        <div className="relative inline-flex items-center justify-center" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform -rotate-90">
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke={trackColor}
              strokeWidth={strokeWidth}
              fill="transparent"
            />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke={color}
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              fill="transparent"
              style={{ transition: 'stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1)' }}

                  </div>
                  <span 
                    className="text-[10px] font-bold mt-1 transition-colors" 
                    style={{ color: currentScreen === 'schedule' ? theme.oliveAccent : theme.textMuted }}
                  >
                    برنامه
                  </span>
                  {/* Neon Micro Indicator Dot */}
                  <div 
                    className="h-1 rounded-full mt-0.5 transition-all duration-300"
                    style={{ 
                      width: currentScreen === 'schedule' ? '12px' : '0px',
                      backgroundColor: theme.oliveAccent,
                      boxShadow: currentScreen === 'schedule' ? `0 0 8px ${theme.oliveAccent}` : 'none'
                    }}
                  />
                </button>

                {/* 3. 3D ELEVATED VOLUMETRIC CENTER FAB "+" */}
                <div className="relative -top-6 flex-shrink-0 px-1">
                  <div className="relative flex items-center justify-center">
                    {/* Pulsing Aura */}
                    <div 
                      className="absolute w-16 h-16 rounded-full blur-md opacity-50 animate-pulse pointer-events-none"
                      style={{ backgroundColor: theme.oliveAccent }}
                    />
                    
                    {/* 3D Sphere Button */}
                    <button
                      onClick={() => setShowAddTask(true)}
                      className="w-14 h-14 rounded-full flex items-center justify-center shadow-2xl transition-all duration-300 transform active:scale-85 hover:scale-108 text-white relative overflow-hidden border-2"
                      style={{ 
                        background: `linear-gradient(145deg, ${theme.oliveDark || '#8DA366'} 0%, ${theme.oliveAccent} 55%, ${theme.petrol || '#1E363E'} 100%)`,
                        borderColor: 'rgba(255, 255, 255, 0.65)',
                        boxShadow: '0 12px 28px -2px rgba(0, 0, 0, 0.35), inset 0 2px 4px 0 rgba(255, 255, 255, 0.55)'
                      }}
                      title="افزودن امکانات و تکالیف"
                    >
                      {/* Top Specular Sheen */}
                      <div 
                        className="absolute inset-x-0 top-0 h-1/2 rounded-t-full opacity-40 pointer-events-none"
                        style={{ background: 'linear-gradient(to bottom, rgba(255,255,255,0.7), transparent)' }}
                      />
                      <Icons.Plus size={28} color="#FFFFFF" />
                    </button>
                  </div>
                </div>

                {/* 4. Tasks */}
                <button
                  onClick={() => setCurrentScreen('tasks')}
                  className="flex flex-col items-center justify-center flex-1 py-1 transition-all active:scale-90 group"
                >
                  <div 
                    className="px-3.5 py-1.5 rounded-2xl flex items-center justify-center transition-all duration-300 border"
                    style={{
                      backgroundColor: currentScreen === 'tasks' ? (theme.isDark ? 'rgba(255,255,255,0.08)' : '#EEF1E8') : 'transparent',
                      borderColor: currentScreen === 'tasks' ? (theme.isDark ? 'rgba(255,255,255,0.15)' : 'rgba(102,112,82,0.25)') : 'transparent',
                      transform: currentScreen === 'tasks' ? 'scale(1.05)' : 'scale(1)'
                    }}
                  >
                    <Icons.CheckSquare 
                      size={20} 
                      filled={currentScreen === 'tasks'} 
                      color={currentScreen === 'tasks' ? theme.oliveAccent : theme.textMuted} 
                    />
                  </div>
                  <span 
                    className="text-[10px] font-bold mt-1 transition-colors" 
                    style={{ color: currentScreen === 'tasks' ? theme.oliveAccent : theme.textMuted }}
                  >
                    کارها
                  </span>
                  {/* Neon Micro Indicator Dot */}
                  <div 
                    className="h-1 rounded-full mt-0.5 transition-all duration-300"
                    style={{ 
                      width: currentScreen === 'tasks' ? '12px' : '0px',
                      backgroundColor: theme.oliveAccent,
                      boxShadow: currentScreen === 'tasks' ? `0 0 8px ${theme.oliveAccent}` : 'none'
                    }}
                  />
                </button>

                {/* 5. More / Grades */}
                <button
                  onClick={() => setCurrentScreen('grades')}
                  className="flex flex-col items-center justify-center flex-1 py-1 transition-all active:scale-90 group"
                >
                  <div 
                    className="px-3.5 py-1.5 rounded-2xl flex items-center justify-center transition-all duration-300 border"
                    style={{
                      backgroundColor: currentScreen === 'grades' ? (theme.isDark ? 'rgba(255,255,255,0.08)' : '#EEF1E8') : 'transparent',
                      borderColor: currentScreen === 'grades' ? (theme.isDark ? 'rgba(255,255,255,0.15)' : 'rgba(102,112,82,0.25)') : 'transparent',
                      transform: currentScreen === 'grades' ? 'scale(1.05)' : 'scale(1)'
                    }}
                  >
                    <Icons.MoreHorizontal 
                      size={20} 
                      color={currentScreen === 'grades' ? theme.oliveAccent : theme.textMuted} 
                    />
                  </div>
                  <span 
                    className="text-[10px] font-bold mt-1 transition-colors" 
                    style={{ color: currentScreen === 'grades' ? theme.oliveAccent : theme.textMuted }}
                  >
                    بیشتر
                  </span>
                  {/* Neon Micro Indicator Dot */}
                  <div 
                    className="h-1 rounded-full mt-0.5 transition-all duration-300"
                    style={{ 
                      width: currentScreen === 'grades' ? '12px' : '0px',
                      backgroundColor: theme.oliveAccent,
                      boxShadow: currentScreen === 'grades' ? `0 0 8px ${theme.oliveAccent}` : 'none'
                    }}
                  />
                </button>
              </div>
            </div>
          </div>

          {/* ================= THEME PICKER MODAL / SHEET ================= */}
          {showThemePicker && (
            <div className="absolute inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm animate-fade">
              <div 
                className="w-full rounded-t-[32px] p-6 animate-slide-up border-t space-y-4 shadow-2xl"
                style={{ backgroundColor: theme.surface, borderColor: theme.border }}
              >
                <div className="w-12 h-1.5 rounded-full mx-auto mb-2 opacity-30" style={{ backgroundColor: theme.textSecondary }}></div>
                
                <div className="flex items-center justify-between pb-1">
                  <button 
                    onClick={() => setShowThemePicker(false)}
                    className="p-1 rounded-full hover:opacity-70"
                    style={{ color: theme.textMuted }}
                  >
                    <Icons.X size={20} color={theme.textMuted} />
                  </button>
                  <div className="text-right">
                    <h3 className="text-[18px] font-bold" style={{ color: theme.textPrimary }}>
                      تم‌های پیشنهادی
                    </h3>
                    <p className="text-[12px]" style={{ color: theme.textMuted }}>
                      شما می‌توانید از بین این تم‌ها یکی را انتخاب کنید.
                    </p>
                  </div>
                </div>

                {/* 4 Theme Option Pill Rows */}
                <div className="space-y-2.5 pt-2">
                  {Object.values(THEMES).map((t) => {
                    const isSelected = currentThemeKey === t.id;
                    return (
                      <button
                        key={t.id}
                        onClick={() => handleThemeChange(t.id)}
                        className="w-full p-4 rounded-2xl flex items-center justify-between transition border active:scale-[0.98]"
                        style={{ 
                          backgroundColor: isSelected ? theme.surfaceSoft : 'transparent',
                          borderColor: isSelected ? theme.oliveAccent : theme.borderLight,
                          color: theme.textPrimary
                        }}
                      >
                        {/* Selected Indicator */}
                        <div className="w-5 h-5 rounded-full flex items-center justify-center">
                          {isSelected && <Icons.Check size={16} color={theme.oliveAccent} />}
                        </div>

                        {/* Theme Name and Color Dot */}
                        <div className="flex items-center gap-3">
                          <span className="text-[14px] font-bold">{t.name}</span>
                          <span 
                            className="w-5 h-5 rounded-full shadow-sm border"
                            style={{ backgroundColor: t.dotColor, borderColor: 'rgba(0,0,0,0.1)' }}
                          ></span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {/* ================= ADD TASK BOTTOM SHEET ================= */}
          {showAddTask && (
            <div className="absolute inset-0 z-50 flex items-end justify-center bg-black/40 backdrop-blur-sm">
              <div 
                className="w-full rounded-t-[32px] p-6 animate-slide-up border-t space-y-4 shadow-2xl"
                style={{ backgroundColor: theme.surface, borderColor: theme.border }}
              >
                <div className="w-12 h-1.5 rounded-full mx-auto mb-1 opacity-30" style={{ backgroundColor: theme.textSecondary }}></div>

                <div className="flex items-center justify-between">
                  <button 
                    onClick={() => setShowAddTask(false)}
                    className="p-1 rounded-full hover:opacity-70"
                  >
                    <Icons.X size={20} color={theme.textMuted} />
                  </button>
                  <h3 className="text-[17px] font-bold" style={{ color: theme.textPrimary }}>
                    افزودن تکلیف جدید
                  </h3>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const title = form.taskTitle.value;
                  const courseId = form.courseSelect.value;
                  const due = form.dueStatus.value;
                  handleAddNewTask(title, courseId, due);
                }} className="space-y-3.5 text-right">
                  <div>
                    <label className="text-[12px] font-bold block mb-1" style={{ color: theme.textSecondary }}>
                      عنوان تکلیف
                    </label>
                    <input 
                      type="text" 
                      name="taskTitle"
                      required
                      placeholder="مثلاً: حل تمرین‌های صفحه ۴۲"
                      className="w-full px-4 py-2.5 rounded-xl border text-[13px] outline-none"
                      style={{ 
                        backgroundColor: theme.surfaceSoft, 
                        borderColor: theme.border,
                        color: theme.textPrimary 
                      }}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="text-[12px] font-bold block mb-1" style={{ color: theme.textSecondary }}>
                        درس مربوطه
                      </label>
                      <select 
                        name="courseSelect"
                        className="w-full px-3 py-2.5 rounded-xl border text-[13px] outline-none"
                        style={{ 
                          backgroundColor: theme.surfaceSoft, 
                          borderColor: theme.border,
                          color: theme.textPrimary 
                        }}
                      >
                        {INITIAL_COURSES.map(c => (
                          <option key={c.id} value={c.id}>{c.name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-[12px] font-bold block mb-1" style={{ color: theme.textSecondary }}>
                        موعد تحویل
                      </label>
                      <select 
                        name="dueStatus"
                        className="w-full px-3 py-2.5 rounded-xl border text-[13px] outline-none"
                        style={{ 
                          backgroundColor: theme.surfaceSoft, 
                          borderColor: theme.border,
                          color: theme.textPrimary 
                        }}
                      >
                        <option value="امروز">امروز</option>
                        <option value="تا فردا">تا فردا</option>
                        <option value="در انتظار">در انتظار</option>
                      </select>
                    </div>
                  </div>

                  <button 
                    type="submit"
                    className="w-full py-3 rounded-2xl text-[14px] font-bold text-white transition active:scale-95 shadow-md mt-2"
                    style={{ backgroundColor: theme.oliveAccent }}
                  >
                    ثبت تکلیف
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ================= NOTIFICATION TOAST ================= */}
          {showNotificationToast && (
            <div 
              className="absolute top-12 inset-x-6 z-50 p-4 rounded-2xl border shadow-xl flex items-center justify-between animate-slide-up"
              style={{ backgroundColor: theme.surface, borderColor: theme.border }}
            >
              <button onClick={() => setShowNotificationToast(false)}>
                <Icons.X size={16} color={theme.textMuted} />
              </button>
              <div className="text-right">
                <span className="text-[13px] font-bold block" style={{ color: theme.textPrimary }}>
                  یادآور کلاس بعدی
                </span>
                <span className="text-[11px]" style={{ color: theme.textMuted }}>
                  کلاس ریاضی عمومی ۱۰:۱۵ در ساختمان علوم شروع می‌شود.
                </span>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StudentOSApp />);
  </script>
</body>
</html>
