name: Build and Publish Bazaar Guest Hotfix

on:
  push:
    tags:
      - v1.0.3-production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Decode production keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > studentos-release.jks

      - name: Build signed 1.0.3
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Verify signing and package
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          NORMALIZED="$(echo "$CERTS" | tr -d ":\r\n" | tr "[:upper:]" "[:lower:]")"
          echo "$NORMALIZED" | grep -F a335e71031ec78a7961656b2c36d8c53abcb3bdc28e265998cf6053fb94eb950 >/dev/null
          echo "$NORMALIZED" | grep -F b25fe31884ec18a96ae09e6fc0070fd20717a766 >/dev/null
          "$AAPT" dump badging "$APK" | grep -F versionName >/dev/null

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.3-production app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab --title "Student OS v1.0.3 — Bazaar Guest Access" --notes-file RELEASE_NOTES_v1.0.3_BAZAAR.md