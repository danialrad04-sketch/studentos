name: Master Plan Google Auth Test APK

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studentos-masterplan-google-test
  cancel-in-progress: false

jobs:
  build-google-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > studentos-release.jks

      - name: Build Google-compatible signed APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease -PVERSION_CODE=1004 -PVERSION_NAME=1.0.4-masterplan-test --stacktrace

      - name: Verify APK and certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          command -v apksigner
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: studentos-masterplan-google-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
