name: Master Plan Google Auth Test APK

on:
  push:
    branches:
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studentos-masterplan-google-test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-google-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Google Login validation is intentionally focused on the release artifact and
      # its production signing certificate. Full unit/lint coverage is provided by
      # the canonical Android CI gate.
      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > studentos-release.jks

      - name: Build Google-compatible signed APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease -PVERSION_CODE=2010 -PVERSION_NAME=2.4.0-rc --stacktrace

      - name: Verify APK and certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          test -s "$APK"
          ls -lh "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$CERTS"
          NORMALIZED="$(echo "$CERTS" | tr -d ":\r\n" | tr "[:upper:]" "[:lower:]")"
          echo "$NORMALIZED" | grep -F "a335e71031ec78a7961656b2c36d8c53abcb3bdc28e265998cf6053fb94eb950" >/dev/null
          echo "$NORMALIZED" | grep -F "b25fe31884ec18a96ae09e6fc0070fd20717a766" >/dev/null
          echo "APK exists and matches the production Google Login signing certificate."
      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: studentos-v2-google-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
