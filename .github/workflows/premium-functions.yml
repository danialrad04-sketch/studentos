name: Premium Firebase verification
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: premium-functions-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  premium-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked Firebase dependencies
        working-directory: functions
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify server code and billing policies
        working-directory: functions
        run: |
          npm run check
          npm test
      - name: Verify real Firestore transactions and client security rules
        working-directory: functions
        run: npm run test:emulator
