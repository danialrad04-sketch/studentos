name: Publish Google Fix Preview

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.0-google-fix-preview"             app/build/outputs/apk/debug/app-debug.apk             --title "Student OS v1.0.0 Google Fix Preview"             --prerelease             --notes "Preview build containing the unified authentication UI and Google Credential Manager fixes. Debug-signed; not the final Bazaar production build."
