name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      title:
        description: "Release title"
        required: true
        default: "Student OS v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/studentos-release.jks

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: app/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify signing and outputs
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab

      - name: Generate CafeBazaar BIN
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          curl -L --fail --retry 5 -o bundlesigner-0.1.13.jar \
            https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.13/bundlesigner-0.1.13.jar
          printf '%s' "$STORE_PASSWORD" > /tmp/store.pass
          printf '%s' "$KEY_PASSWORD" > /tmp/key.pass
          java -jar bundlesigner-0.1.13.jar genbin -v \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --bin app/build/outputs/bundle/release \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks app/studentos-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass file:/tmp/store.pass \
            --key-pass file:/tmp/key.pass
          test -s app/build/outputs/bundle/release/app-release.bin
          rm -f /tmp/store.pass /tmp/key.pass bundlesigner-0.1.13.jar

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="Student OS ${TAG}"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release.bin \
            --title "$TITLE" \
            --generate-notes