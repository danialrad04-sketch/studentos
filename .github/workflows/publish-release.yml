name: Build and Publish Release

on:
  push:
    tags:
      - "v2.0.1"
    branches:
      - "production-release/v2.0.1"
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0.1"
        required: true
        default: "v2.0.1"
      title:
        description: "Release title"
        required: true
        default: "Student OS v2.0.1"
      ref:
        description: "Git tag or commit SHA to build; must be immutable for a reproducible release."
        required: true
        default: "main"
      version_code:
        description: "Monotonic Android versionCode; verify against the latest published artifact."
        required: false
        default: "5"
      version_name:
        description: "Android versionName; must match the release tag without the leading v."
        required: false
        default: "2.0.0"

permissions:
  contents: write

concurrency:
  group: studentos-release-v5
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && github.ref_name == 'production-release/v2.0.1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve immutable release source
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" = "production-release/v2.0.1" ]; then
            RELEASE_TARGET_SHA="$(git rev-parse HEAD^)"
            test -n "$RELEASE_TARGET_SHA"
            git checkout --detach "$RELEASE_TARGET_SHA"
          else
            RELEASE_TARGET_SHA="$GITHUB_SHA"
          fi
          echo "RELEASE_TARGET_SHA=$RELEASE_TARGET_SHA" >> "$GITHUB_ENV"
          echo "Release source: $RELEASE_TARGET_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > studentos-release.jks

      - name: Validate release version inputs
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ inputs.version_code || '6' }}
          VERSION_NAME: ${{ inputs.version_name || '2.0.1' }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG="$REF_NAME"
            TAG="${TAG#production-release/}"
          fi
          test -n "$TAG"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$VERSION_NAME" = "$(printf '%s' "$TAG" | sed 's/^v//')"
          case "$VERSION_CODE" in
            (*[!0-9]*|'') exit 1 ;;
          esac
          test "$VERSION_CODE" -gt 0

      - name: Run Android unit and lint gates
        run: |
          ./gradlew testDebugUnitTest lintDebug lintRelease \
            -PVERSION_CODE=${{ inputs.version_code || '6' }} \
            -PVERSION_NAME=${{ inputs.version_name || '2.0.1' }} \
            --stacktrace --no-daemon

      - name: Run backend tests
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Verify Android quality gate for release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Release ref: ${RELEASE_TARGET_SHA}"
          for attempt in {1..30}; do
            RUN_IDS=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow android-build.yml --commit "${RELEASE_TARGET_SHA}" --limit 10 --json databaseId --jq '.[].databaseId')
            for RUN_ID in ${RUN_IDS}; do
              CONCLUSION=$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq '.jobs[] | select(.name=="android-quality") | .conclusion' | head -n 1)
              echo "Android CI run ${RUN_ID}: android-quality=${CONCLUSION:-pending}"
              if [ "${CONCLUSION}" = "success" ]; then
                echo "Android quality gate passed for release SHA."
                exit 0
              fi
              if [ "${CONCLUSION}" = "failure" ] || [ "${CONCLUSION}" = "cancelled" ]; then
                echo "::error::Android quality gate failed for release SHA."
                exit 1
              fi
            done
            echo "Waiting for Android quality gate... attempt ${attempt}/30"
            sleep 10
          done
          echo "::error::Timed out waiting for Android quality gate for release SHA."
          exit 1

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease bundleRelease             -PVERSION_CODE=${{ inputs.version_code || '6' }} -PVERSION_NAME=${{ inputs.version_name || '2.0.1' }}             --stacktrace --no-daemon

      - name: Verify signed outputs
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          SDK_APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$SDK_APKSIGNER"
          echo "Using apksigner: $SDK_APKSIGNER"
          "$SDK_APKSIGNER" verify --verbose --print-certs "$APK" || {
            echo "::error::APK signature verification failed"
            "$SDK_APKSIGNER" verify --verbose --print-certs "$APK" 2>&1 || true
            exit 1
          }
          EXPECTED_SHA256="a335e71031ec78a7961656b2c36d8c53abcb3bdc28e265998cf6053fb94eb950"
          EXPECTED_SHA1="b25fe31884ec18a96ae09e6fc0070fd20717a766"
          KEY_SHA256="$(keytool -list -v -keystore studentos-release.jks -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" -alias "${{ secrets.RELEASE_KEY_ALIAS }}" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          KEY_SHA1="$(keytool -list -v -keystore studentos-release.jks -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" -alias "${{ secrets.RELEASE_KEY_ALIAS }}" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$KEY_SHA256" = "$EXPECTED_SHA256"
          test "$KEY_SHA1" = "$EXPECTED_SHA1"
          echo "Release certificate fingerprint matches Student OS production certificate."

          unzip -t "$AAB"
          python3 scripts/check_apk_16kb.py "$APK"
          unzip -l "$AAB" | grep -E 'BundleConfig.pb|base/manifest/AndroidManifest.xml'
          ls -lh "$APK" "$AAB"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          TITLE_INPUT: ${{ inputs.title }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG="$REF_NAME"
            TAG="${TAG#production-release/}"
          fi
          TITLE="$TITLE_INPUT"
          if [ -z "$TITLE" ]; then
            TITLE="Student OS $TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 && {
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          } || true
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            --target "$RELEASE_TARGET_SHA" \
            --title "$TITLE" \
            --generate-notes
