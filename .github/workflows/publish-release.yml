name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full 40-character commit SHA with successful Android CI"
        required: true
      tag:
        description: "Release tag matching version_name"
        required: true
        default: "v2.3.0"
      version_code:
        description: "Must exceed every previously distributed build"
        required: true
        default: "2009"
      version_name:
        description: "Android version name"
        required: true
        default: "2.3.0"

permissions:
  contents: write
  actions: read

concurrency:
  group: studentos-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_REF: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Validate immutable target and version
        shell: bash
        run: |
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION_CODE" -gt 2005
          test "$RELEASE_TAG" = "v$VERSION_NAME"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify all quality gates on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow android-build.yml \
            --commit "$RELEASE_REF" --limit 20 --json databaseId,status,conclusion > /tmp/runs.json
          RUN_ID=$(python3 -c 'import json; r=next((r for r in json.load(open("/tmp/runs.json")) if r["status"]=="completed" and r["conclusion"]=="success"),None); assert r, "No successful Android CI for release commit"; print(r["databaseId"])')
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > /tmp/jobs.json
          python3 - <<'PY'
          import json
          jobs = {j['name']: j['conclusion'] for j in json.load(open('/tmp/jobs.json'))['jobs']}
          for name in ['android-quality', 'backend-quality', 'instrumented-smoke', 'release-artifact-validation']:
              assert jobs.get(name) == 'success', f'{name} did not pass'
          PY
          gh run list --repo "$GITHUB_REPOSITORY" --workflow premium-functions.yml \
            --commit "$RELEASE_REF" --limit 20 --json status,conclusion > /tmp/premium-runs.json
          python3 - <<'PY'
          import json
          runs = json.load(open('/tmp/premium-runs.json'))
          assert any(r['status'] == 'completed' and r['conclusion'] == 'success' for r in runs), 'No successful Firebase premium verification for release commit'
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode existing production key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/studentos-release.jks"

      - name: Build signed universal APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease \
            -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME" --stacktrace

      - name: Verify packaged identity and signing
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          test -s "$APK"
          test -s "$AAB"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/certificates.txt
          grep -Fi 'a335e71031ec78a7961656b2c36d8c53abcb3bdc28e265998cf6053fb94eb950' /tmp/certificates.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.aistudio.studentos.appvzk' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK"
          python3 scripts/check_apk_16kb.py "$APK"
          jarsigner -verify "$AAB"
          unzip -t "$AAB"
          mkdir -p release-output
          cp "$APK" "release-output/StudentOS-$VERSION_NAME.apk"
          cp "$AAB" "release-output/StudentOS-$VERSION_NAME.aab"
          cd release-output
          sha256sum ./*.apk ./*.aab > SHA256SUMS.txt

      - name: Generate and verify Cafe Bazaar BIN
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          bash scripts/generate_bazaar_bin.sh "release-output/StudentOS-$VERSION_NAME.aab" "release-output/StudentOS-$VERSION_NAME.bin"
          cd release-output
          sha256sum ./*.apk ./*.aab ./*.bin > SHA256SUMS.txt

      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-output/* \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_REF" \
            --title "Student OS $VERSION_NAME" --draft \
            --notes-file docs/RELEASE_NOTES_V2_3.md

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/studentos-release.jks"
