name: Student OS v2.0.0 Direct Release

on:
  push:
    branches:
      - "production-release/v2.0.0-fast"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: studentos-v2-direct-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release source
        shell: bash
        run: |
          RELEASE_TARGET_SHA="$(git rev-parse HEAD^)"
          test "$RELEASE_TARGET_SHA" = "7aa850a92b61f6d3d2d8ec47963fdaec3b3003f3"
          echo "RELEASE_TARGET_SHA=$RELEASE_TARGET_SHA" >> "$GITHUB_ENV"
          echo "Release source: $RELEASE_TARGET_SHA"

      - name: Cancel stale release publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 36758611045 --repo "$GITHUB_REPOSITORY" || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > studentos-release.jks

      - name: Download verified v2 release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          gh run download 36754841948 --repo "$GITHUB_REPOSITORY" --name studentos-v2-release-candidates --dir release-assets
          find release-assets -maxdepth 2 -type f -print

      - name: Verify APK, AAB, version, certificate and 16 KB
        shell: bash
        run: |
          APK="$(find release-assets -type f -name 'app-release.apk' | head -n 1)"
          AAB="$(find release-assets -type f -name 'app-release.aab' | head -n 1)"
          test -s "$APK"
          test -s "$AAB"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERTS="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          NORMALIZED="$(echo "$CERTS" | tr -d ':\r\n' | tr '[:upper:]' '[:lower:]')"
          echo "$NORMALIZED" | grep -F "a335e71031ec78a7961656b2c36d8c53abcb3bdc28e265998cf6053fb94eb950" >/dev/null
          echo "$NORMALIZED" | grep -F "b25fe31884ec18a96ae09e6fc0070fd20717a766" >/dev/null

          BADGING="$("$AAPT2" dump badging "$APK")"
          echo "$BADGING" | grep -F "versionCode='5'" >/dev/null
          echo "$BADGING" | grep -F "versionName='2.0.0'" >/dev/null
          echo "$BADGING" | grep -F "package: name='com.aistudio.studentos.appvzk'" >/dev/null

          unzip -t "$AAB" >/dev/null
          python3 scripts/check_apk_16kb.py "$APK"
          ls -lh "$APK" "$AAB"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving existing release untouched."
            exit 0
          fi
          APK="$(find release-assets -type f -name 'app-release.apk' | head -n 1)"
          AAB="$(find release-assets -type f -name 'app-release.aab' | head -n 1)"
          gh release create "$TAG" "$APK" "$AAB" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Student OS v2.0.0" \
            --notes-file RELEASE_NOTES_v2.0.0.md

      - name: Cancel duplicate tag-triggered publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            RUN_IDS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "publish-release.yml" --limit 20 --json databaseId --jq '.[].databaseId')"
            for RUN_ID in $RUN_IDS; do
              if [ "$RUN_ID" != "$GITHUB_RUN_ID" ]; then
                gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY" || true
              fi
            done
            sleep 3
          done