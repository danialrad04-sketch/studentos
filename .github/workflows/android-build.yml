name: Android CI

on:
  push:
    branches: ["main", "release-readiness", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  android-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Decode fixed Student OS signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/studentos-release.jks"

      - name: Build Firebase-compatible debug APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studentos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend JavaScript syntax
        working-directory: backend
        run: |
          node --check src/db.js
          node --check src/server.js
          node --check src/migrate.js
          node --check src/middleware/auth.js
          node --check src/routes/auth.js
          node --check src/routes/sync.js
          node --check src/utils/jwt.js
          node --check ../functions/index.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run backend unit tests
        working-directory: backend
        run: npm test

  instrumented-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: studentos-api35
          force-avd-creation: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
