name: Android CI

on:
  push:
    branches: ["main", "release-readiness", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: studentos-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Decode fixed Student OS signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/studentos-release.jks"

      - name: Build Firebase-compatible debug APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studentos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studentos
          POSTGRES_PASSWORD: studentos
          POSTGRES_DB: studentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U studentos -d studentos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend JavaScript syntax
        working-directory: backend
        run: |
          node --check src/db.js
          node --check src/server.js
          node --check src/migrate.js
          node --check src/middleware/auth.js
          node --check src/routes/auth.js
          node --check src/routes/sync.js
          node --check src/utils/jwt.js
          node --check ../functions/index.js

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run backend unit tests
        working-directory: backend
        run: npm test

      - name: Run backend integration tests against disposable PostgreSQL
        working-directory: backend
        env:
          RUN_BACKEND_INTEGRATION: "1"
          PORT: "31337"
          BACKEND_TEST_URL: http://127.0.0.1:31337
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: studentos
          DB_PASSWORD: studentos
          DB_NAME: studentos_test
          JWT_ACCESS_SECRET: studentos-ci-integration-secret
        run: |
          node src/migrate.js
          node --test test/integration.test.js

  release-artifact-validation:
    runs-on: ubuntu-latest
    needs: [android-quality, backend-quality, instrumented-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/studentos-release.jks"

      - name: Build signed release APK and AAB
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          ./gradlew assembleRelease bundleRelease -PVERSION_CODE=5 -PVERSION_NAME=2.0.0 --stacktrace

      - name: Verify release package, version and signing certificate
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/studentos-release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.aistudio.studentos.appvzk' versionCode='5' versionName='2.0.0'"
          EXPECTED_SHA256="a335e71031ec78a7961656b2c36d8c53abcb3bdc28e265998cf6053fb94eb950"
          EXPECTED_SHA1="b25fe31884ec18a96ae09e6fc0070fd20717a766"
          KEY_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          KEY_SHA1="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$KEY_SHA256" = "$EXPECTED_SHA256"
          test "$KEY_SHA1" = "$EXPECTED_SHA1"
          echo "Release certificate fingerprint matches Student OS production certificate."
          ls -lh "$APK" "$AAB"

          echo "Checking APK ZIP alignment for 16 KB page-size compatibility..."
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          echo "Checking packaged ELF PT_LOAD alignment..."
          python3 scripts/check_apk_16kb.py "$APK"

      - name: Upload release candidates (not published)
        uses: actions/upload-artifact@v4
        with:
          name: studentos-v2-release-candidates
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  instrumented-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          avd-name: studentos-api35
          force-avd-creation: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            run_test() {
              local test_class="$1"
              echo "=== Running instrumentation class: $test_class ==="
              timeout 300 ./gradlew connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class="$test_class" \
                --stacktrace
            }
            run_test com.example.ExampleInstrumentedTest
            run_test com.example.AccessibilitySmokeTest
            run_test com.example.StudentTodayCommandStripTest
